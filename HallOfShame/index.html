<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-HZ2XXFNT02"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-HZ2XXFNT02");
    </script>
    <title>Real Art Maine | Hall of Shame</title>
    <link rel="stylesheet" href="/assets/css/style.css" />

    <link rel="icon" href="/assets/logo.png" type="image/png" />
  </head>
  <body data-hall="shame">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        min-width: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      nav a {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        transition: none;
      }
      nav a:hover,
      nav a:active,
      nav a:focus {
        background: transparent;
        outline: none;
      }
      nav {
        background: #30513d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        box-sizing: border-box;
      }
      .nav-left {
        display: flex;
        gap: 14px;
      }
      .nav-left a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .site-title {
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        margin-left: 0;
      }
      .right-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gear-box {
        flex: 0 0 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gear-box img {
        width: 22px;
        height: 22px;
        display: block;
      }
      .gear-box {
        background: transparent;
        border: 0;
        padding: 0;
      }
      .gear-box img {
        width: 22px;
        height: auto;
        display: block;
        filter: invert(1);
      }
      .settings-dropdown .dropdown-content {
        background: transparent;
        box-shadow: none;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav-left a {
        text-decoration: none !important;
        transition: none !important;
      }
      .nav-left a::before,
      .nav-left a::after {
        display: none !important;
      }
    </style>
    <nav>
      <div class="nav-left">
        <details class="nav-menu">
          <summary class="nav-menu-toggle" aria-label="Menu">
            <span class="nav-menu-icon"></span>
          </summary>
          <div class="nav-menu-panel" role="menu">
            <a href="/Home" aria-label="Home">Home</a>
            <a href="/Gallery" aria-label="Gallery">Gallery</a>
            <a href="/Freights/" aria-label="Freights">Freights</a>
            <a href="/Leaderboard/" aria-label="Leaderboard">Leaderboard</a>
            <a href="/HallOfFame" aria-label="Hall of Fame/Shame"
              >Hall of Fame/Shame</a
            >
          </div>
        </details>
        <a href="/Home" aria-label="Home">Home</a>
        <a href="/Gallery" aria-label="Gallery">Gallery</a>
        <a href="/Freights/" aria-label="Freights">Freights</a>
        <a href="/Leaderboard/" aria-label="Leaderboard">Leaderboard</a>
        <a href="/HallOfFame" aria-label="Hall of Fame/Shame"
          >Hall of Fame/Shame</a
        >
      </div>
      <div class="right-group">
        <div class="settings-dropdown">
          <div class="gear-box">
            <img
              src="/assets/GUI/gear.png"
              alt="Settings"
              class="gear-icon"
              style="filter: invert(1); opacity: 0.9"
            />
          </div>
          <div class="dropdown-content" style="background: transparent"></div>
        </div>
        <div class="site-title">RealArtMaine</div>
      </div>
    </nav>

    <main class="hall-main">
      <header class="hall-header">
        <h1 class="hall-page-title">Hall of Shame</h1>
        <div class="hall-toggle" role="tablist" aria-label="Hall selector">
          <a
            href="/HallOfFame"
            class="hall-toggle-link"
            role="tab"
            aria-selected="false"
            >Hall of Fame</a
          >
          <a
            href="/HallOfShame"
            class="hall-toggle-link active"
            role="tab"
            aria-selected="true"
            >Hall of Shame</a
          >
        </div>
      </header>

      <div class="search-bar hall-controls">
        <select id="hallSortSelect" aria-label="Sort entries" title="Sort entries">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <section class="hall-entries" id="hallEntries"></section>
    </main>

    <script src="/assets/js/maintenance.js"></script>
    <script src="/assets/js/hall_labels.js"></script>
    <script src="/assets/js/hall.js"></script>
    <script src="/assets/js/settings.js"></script>
    <script src="/assets/js/background.js"></script>
  </body>
</html>
