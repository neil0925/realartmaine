<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />

    <title>Real Art Maine | Leaderboard</title>
    <link rel="stylesheet" href="/assets/css/style.css" />

    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <style>
      .leaderboard {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px;
        min-height: calc(100vh - 88px);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .leaderboard h1 {
        text-align: center;
        margin: 8px 0 18px 0;
      }
      .leaderboard .table-wrap {
        flex: 1 1 auto;
        overflow: auto;
      }
      .leaderboard-table {
        width: 100%;
        border-collapse: collapse;
      }
      .leaderboard-table thead th {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 2px solid rgba(0, 0, 0, 0.06);
        font-weight: 700;
        position: sticky;
        top: 0;
        background: inherit;
        z-index: 2;
      }
      .leaderboard-table tbody td {
        padding: 12px 10px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      }
      .rank-col {
        width: 96px;
        text-align: center;
      }
      .photog-col {
        text-align: left;
      }
      .count-col {
        width: 160px;
        text-align: right;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        min-width: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      nav a {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        transition: none;
      }
      nav a:hover,
      nav a:active,
      nav a:focus {
        background: transparent;
        outline: none;
      }
      nav {
        background: #30513d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        box-sizing: border-box;
      }
      .nav-left {
        display: flex;
        gap: 14px;
      }
      .nav-left a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .site-title {
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        margin-left: 0;
      }
      .gear-box {
        background: transparent;
        border: 0;
        padding: 0;
      }
      .gear-box img {
        width: 22px;
        height: auto;
        display: block;
        filter: invert(1);
      }
      .settings-dropdown .dropdown-content {
        background: transparent;
        box-shadow: none;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav-left a {
        text-decoration: none !important;
        transition: none !important;
      }
      .nav-left a::before,
      .nav-left a::after {
        display: none !important;
      }
      .right-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gear-box {
        flex: 0 0 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gear-box img {
        width: 22px;
        height: 22px;
        display: block;
        filter: invert(1);
      }
    </style>
    <nav>
      <div class="nav-left">
        <details class="nav-menu">
          <summary class="nav-menu-toggle" aria-label="Menu">
            <span class="nav-menu-icon"></span>
          </summary>
          <div class="nav-menu-panel" role="menu">
            <a href="/Home" aria-label="Home">Home</a>
            <a href="/Gallery" aria-label="Gallery">Gallery</a>
            <a href="/Leaderboard" aria-label="Leaderboard">Leaderboard</a>
          </div>
        </details>
        <a href="/Home" aria-label="Home">Home</a>
        <a href="/Gallery" aria-label="Gallery">Gallery</a>
        <a href="/Leaderboard" aria-label="Leaderboard">Leaderboard</a>
      </div>
      <div class="right-group">
        <div class="settings-dropdown">
          <div class="gear-box">
            <img
              src="/assets/GUI/gear.png"
              alt="Settings"
              class="gear-icon"
              style="filter: invert(1); opacity: 0.9"
            />
          </div>
          <div class="dropdown-content" style="background: transparent"></div>
        </div>
        <div class="site-title">RealArtMaine</div>
      </div>
    </nav>

    <main>
      <section class="leaderboard" id="leaderboard">
        <p>Loading leaderboard…</p>
      </section>
    </main>

    <script src="/assets/js/maintenance.js"></script>
    <script src="/assets/js/gallery.js"></script>
    <script src="/assets/js/leaderboard.js"></script>
    <script src="/assets/js/settings.js"></script>
    <script src="/assets/js/background.js"></script>
  </body>
</html>
