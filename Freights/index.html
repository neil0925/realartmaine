<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-HZ2XXFNT02"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-HZ2XXFNT02");
    </script>
    <title>Real Art Maine | Freights</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
  </head>
  <body>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        min-width: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      nav a {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        transition: none;
      }
      nav a:hover,
      nav a:active,
      nav a:focus {
        background: transparent;
        outline: none;
      }
      nav {
        background: #30513d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        box-sizing: border-box;
      }
      .nav-left {
        display: flex;
        gap: 14px;
      }
      .nav-left a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .site-title {
        color: #fff;
        font-weight: 800;
        font-size: 1.05rem;
        margin-left: 0;
      }
      .right-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gear-box {
        flex: 0 0 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gear-box img {
        width: 22px;
        height: 22px;
        display: block;
      }
      .gear-box {
        background: transparent;
        border: 0;
        padding: 0;
      }
      .gear-box img {
        width: 22px;
        height: auto;
        display: block;
        filter: invert(1);
      }
      .settings-dropdown .dropdown-content {
        background: transparent;
        box-shadow: none;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav-left a {
        text-decoration: none !important;
        transition: none !important;
      }
      .nav-left a::before,
      .nav-left a::after {
        display: none !important;
      }
      .freight-search-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .freight-search-bar #searchInput {
        width: min(620px, 72vw);
      }
      .freight-filter-dropdown {
        position: relative;
      }
      .freight-filter-dropdown > summary {
        list-style: none;
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid rgba(48, 81, 61, 0.4);
        color: #30513d;
        background-color: transparent;
        background-image: url("/assets/GUI/tile.png");
        background-repeat: repeat;
        background-size: 400px 400px;
        font-family: var(--ram-font8);
      }
      .freight-filter-dropdown > summary::-webkit-details-marker {
        display: none;
      }
      .freight-filter-dropdown > summary::after {
        content: " \25BE";
      }
      .freight-filter-dropdown[open] > summary::after {
        content: " \25B4";
      }
      .freight-filter-panel {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 210px;
        border-radius: 8px;
        border: 1px solid rgba(48, 81, 61, 0.4);
        background-image: url("/assets/GUI/tile.png");
        background-repeat: repeat;
        background-size: 400px 400px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
        padding: 8px;
        z-index: 2500;
        color: #30513d;
        font-family: var(--ram-font8);
        font-size: 0.88rem;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .freight-filter-panel label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      @media (max-width: 700px) {
        .freight-search-bar {
          gap: 8px;
        }
        .freight-search-bar #searchInput {
          width: min(620px, 90vw);
          order: 2;
        }
      }
    </style>
    <nav>
      <div class="nav-left">
        <details class="nav-menu">
          <summary class="nav-menu-toggle" aria-label="Menu">
            <span class="nav-menu-icon"></span>
          </summary>
          <div class="nav-menu-panel" role="menu">
            <a href="/Home" aria-label="Home">Home</a>
            <a href="/Gallery" aria-label="Gallery">Gallery</a>
            <a href="/Freights/" aria-label="Freights">Freights</a>
            <a href="/Leaderboard/" aria-label="Leaderboard">Leaderboard</a>
          </div>
        </details>
        <a href="/Home" aria-label="Home">Home</a>
        <a href="/Gallery" aria-label="Gallery">Gallery</a>
        <a href="/Freights/" aria-label="Freights">Freights</a>
        <a href="/Leaderboard/" aria-label="Leaderboard">Leaderboard</a>
      </div>
      <div class="right-group">
        <div class="settings-dropdown">
          <div class="gear-box">
            <img
              src="/assets/GUI/gear.png"
              alt="Settings"
              class="gear-icon"
              style="filter: invert(1); opacity: 0.9"
            />
          </div>
          <div class="dropdown-content" style="background: transparent"></div>
        </div>
        <div class="site-title">RealArtMaine</div>
      </div>
    </nav>

    <main style="flex: 1 1 auto">
      <div class="search-bar freight-search-bar">
        <details class="freight-filter-dropdown" id="freightFilterMenu">
          <summary aria-label="Freight filters">Freight Filters</summary>
          <div class="freight-filter-panel">
            <label for="freightMaineToggle">
              <input type="checkbox" id="freightMaineToggle" />
              Maine freights
            </label>
            <label for="freightMaineWritersToggle">
              <input type="checkbox" id="freightMaineWritersToggle" />
              Maine writers
            </label>
            <label for="freightOutStateWritersToggle">
              <input type="checkbox" id="freightOutStateWritersToggle" />
              Out of state writers
            </label>
          </div>
        </details>

        <input
          type="text"
          id="searchInput"
          placeholder="Search tags, crews, photographers, or styles..."
        />

        <select
          id="sortSelect"
          aria-label="Sort results"
          title="Sort results"
          style="margin-left: 0; padding: 8px; border-radius: 6px"
        >
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <div class="gallery" id="galleryContainer"></div>
    </main>

    <script src="/assets/js/maintenance.js"></script>
    <script src="/assets/js/gallery.js"></script>
    <script src="/assets/js/settings.js"></script>
    <script src="/assets/js/background.js"></script>
  </body>
</html>
