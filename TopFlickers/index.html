<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZ2XXFNT02"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HZ2XXFNT02');
  </script>
  <title>Real Art Maine | Top Flickers</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Use single site logo as favicon -->
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <style>
    .leaderboard { max-width:1100px; margin:0 auto; padding:18px; min-height: calc(100vh - 88px); display:flex; flex-direction:column; box-sizing:border-box; }
    .leaderboard h1 { text-align:center; margin:8px 0 18px 0; }
    .leaderboard .table-wrap { flex:1 1 auto; overflow:auto; }
    .leaderboard-table { width:100%; border-collapse: collapse; }
    .leaderboard-table thead th { text-align:left; padding:12px 10px; border-bottom:2px solid rgba(0,0,0,0.06); font-weight:700; position:sticky; top:0; background:inherit; z-index:2; }
    .leaderboard-table tbody td { padding:12px 10px; border-bottom:1px solid rgba(0,0,0,0.04); }
    .rank-col { width:96px; text-align:center; }
    .photog-col { text-align:left; }
    .count-col { width:160px; text-align:right; font-weight:700; }
    body.dark-mode .leaderboard-table thead th { border-color: rgba(255,255,255,0.06); }
    body.dark-mode .leaderboard-table tbody td { border-color: rgba(255,255,255,0.04); }
  </style>
</head>
<body>

  <!-- Navigation (icons kept consistent with other pages) -->
  <style>
    /* Prevent horizontal cutoff and remove selection/hover effects */
    html, body { margin:0; padding:0; box-sizing:border-box; min-width:0; }
    *, *:before, *:after { box-sizing:inherit; }
    nav a { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; transition: none; }
    nav a:hover, nav a:active, nav a:focus { background: transparent; outline: none; }

    nav { background:#30513d; display:flex; align-items:center; justify-content:space-between; padding:8px 14px; box-sizing:border-box; }
    .nav-left { display:flex; gap:14px; }
    .nav-left a { color:#fff; text-decoration:none; font-weight:600; padding:6px 10px; border-radius:6px; }
    .site-title { color:#fff; font-weight:800; font-size:1.05rem; }
    /* Make settings visually minimal */
    .gear-box { background:transparent; border:0; padding:0; }
    .gear-box img { width:22px; height:auto; display:block; filter:invert(1); }
    .settings-dropdown .dropdown-content { background:transparent; box-shadow:none; border:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    /* Disable underline/hover animations on nav links */
    .nav-left a { text-decoration:none !important; transition: none !important; }
    .nav-left a::before, .nav-left a::after { display:none !important; }
  </style>
  <nav>
    <div class="nav-left">
      <a href="/Home" aria-label="Home">Home</a>
      <a href="/Gallery" aria-label="Gallery">Gallery</a>
      <a href="/VideoArchive" aria-label="Videos">Videos</a>
      <a href="/TopFlickers" aria-label="Leaderboard">Leaderboard</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="settings-dropdown">
        <div class="gear-box"><img src="/assets/GUI/gear.png" alt="Settings" class="gear-icon" style="filter:invert(1);opacity:0.9;"></div>
        <div class="dropdown-content" style="background:transparent;">
          <button id="modeToggle" style="margin-top:8px;background:transparent;border:0;color:#fff;">Toggle Mode</button>
        </div>
      </div>
      <div class="site-title">RealArtMaine</div>
    </div>
  </nav>

  <main>
    <section class="leaderboard" id="leaderboard">
      <p>Loading leaderboard…</p>
    </section>
  </main>

  <script src="/assets/js/maintenance.js"></script>
  <script src="/assets/js/gallery.js"></script>
  <script src="/assets/js/topflickers.js"></script>
  <script src="/assets/js/darkmode.js"></script>
</body>
</html>
