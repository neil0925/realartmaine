<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Draw Board | Real Art Maine</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Drawing toolbar */
    #drawToolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 15px auto;
    }
    #drawToolbar label {
      font-weight: bold;
    }
    #drawingBoard {
      width: 90%;
      height: 70vh;
      border: 2px solid #000;
      border-radius: 6px;
      display: block;
      margin: 0 auto 20px auto;
      background: #fff;
      touch-action: none; /* prevent scrolling on mobile while drawing */
    }
    body.dark-mode #drawingBoard {
      background: #111;
      border-color: #fff;
    }

    /* brush preview next to slider */
    #brushPreview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    /* moving cursor preview overlay (follows pointer) */
    #brushCursor {
      position: absolute;
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.18);
      background: transparent;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/Home" class="nav-logo" aria-label="Real Art Maine Home"><img src="/assets/img/logo.svg" alt="Real Art Maine" class="nav-icon"></a>
    <a href="/Gallery">Gallery</a>
    <a href="/VideoArchive">Videos</a>
    <a href="/TopFlickers">Top Flickers</a>
  </nav>

  <main>
    <h1>Free Draw Board</h1>
    <p>Draw anything! Use the tools below to change color, brush size, or clear the board.</p>

    <!-- Toolbar -->
    <div id="drawToolbar">
      <label for="colorPicker">Color:</label>
      <input type="color" id="colorPicker" value="#000000">

      <label for="brushSize">Brush:</label>
      <input type="range" id="brushSize" min="1" max="60" value="4">

      <!-- small preview circle for selected brush size/color -->
      <div id="brushPreview" aria-hidden="true" title="Brush preview"></div>
    </div>

    <!-- Canvas -->
    <canvas id="drawingBoard"></canvas>
    <!-- live cursor preview (positioned over page) -->
    <div id="brushCursor" aria-hidden="true"></div>
  </main>

  <footer>
    <p>Real Art Maine | Graffiti archive</p>
  </footer>

  <!-- Scripts -->
  <script src="/assets/js/strokes.js"></script>
  <script src="/assets/js/board.js"></script>
  <script>
    // Drawing tools
    const colorPicker = document.getElementById("colorPicker");
    const brushSize = document.getElementById("brushSize");
    const brushPreview = document.getElementById("brushPreview");

    // Override default stroke settings in board.js
    window.CURRENT_COLOR = colorPicker.value;
    window.CURRENT_SIZE = parseInt(brushSize.value);

    function updateLocalBrushPreview() {
      const size = parseInt(brushSize.value, 10);
      window.CURRENT_SIZE = size;
      // small toolbar preview
      brushPreview.style.width = brushPreview.style.height = Math.max(6, size) + 'px';
      brushPreview.style.background = window.CURRENT_COLOR;
      // update overlay cursor (board.js exposes updateBrushPreview)
      if (typeof window.updateBrushPreview === 'function') {
        window.updateBrushPreview(window.CURRENT_SIZE, window.CURRENT_COLOR);
      }
    }

    colorPicker.addEventListener("input", e => {
      window.CURRENT_COLOR = e.target.value;
      brushPreview.style.background = window.CURRENT_COLOR;
      if (typeof window.updateBrushPreview === 'function') {
        window.updateBrushPreview(window.CURRENT_SIZE, window.CURRENT_COLOR);
      }
    });

    brushSize.addEventListener("input", e => {
      updateLocalBrushPreview();
    });

    // initialize the preview UI
    updateLocalBrushPreview();

    // Note: pointer events handle touch/mouse/pen input on the canvas; no manual touch shims needed.
  </script>
</body>
</html>
