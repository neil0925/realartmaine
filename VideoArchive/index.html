<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZ2XXFNT02"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HZ2XXFNT02');
  </script>
  <title>Real Art Maine | Video Archive</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <style>
    .leaderboard { display:none; }
    main { padding:18px; }
    .gallery { min-height: 60vh; }
  </style>
</head>
<body>
  <nav>
    <style>
      nav { background:#30513d; display:flex; align-items:center; justify-content:space-between; padding:8px 14px; box-sizing:border-box; }
      .nav-left { display:flex; gap:14px; }
      .nav-left a { color:#fff; text-decoration:none; font-weight:600; padding:6px 10px; border-radius:6px; }
      .nav-left a:hover { background: rgba(255,255,255,0.04); }
      .site-title { color:#fff; font-weight:800; font-size:1.05rem; }
    </style>
    <nav>
      <div class="nav-left">
        <a href="/Home" aria-label="Home">Home</a>
        <a href="/Gallery" aria-label="Gallery">Gallery</a>
        <a href="/VideoArchive" aria-label="Videos">Videos</a>
        <a href="/TopFlickers" aria-label="Leaderboard">Leaderboard</a>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="settings-dropdown">
          <div class="gear-box"><img src="/assets/GUI/gear.png" alt="Settings" class="gear-icon" style="filter:invert(1);opacity:0.9;"></div>
          <div class="dropdown-content" style="background:transparent;">
            <label style="display:flex;align-items:center;gap:6px;color:#fff;"><input type="checkbox" id="tileToggle"> Tiles</label>
            <label style="display:flex;align-items:center;gap:8px;color:#fff;margin-top:6px;">Tile px: <input type="number" id="tileSizeInput" min="8" max="512" value="64" style="width:70px;padding:4px;border-radius:4px;border:1px solid rgba(255,255,255,0.12);"></label>
            <button id="modeToggle" style="margin-top:8px;background:transparent;border:0;color:#fff;">Toggle Mode</button>
          </div>
        </div>
        <div class="site-title">RealArtMaine</div>
      </div>
    </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search videographers, tags, crews, or styles...">
      <select id="sortSelect" aria-label="Sort results" title="Sort results" style="margin-left:10px;padding:8px;border-radius:6px;">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>

    <div class="gallery" id="galleryContainer">
      <!-- Videos inserted by JS -->
    </div>
  </main>

  <script src="/assets/js/maintenance.js"></script>
  <script src="/assets/js/videos.js"></script>
  <script src="/assets/js/darkmode.js"></script>
</body>
</html>
