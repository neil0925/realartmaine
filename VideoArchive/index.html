<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZ2XXFNT02"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HZ2XXFNT02');
  </script>
  <title>Real Art Maine | Video Archive</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <style>
    .leaderboard { display:none; }
    main { padding:18px; }
    .gallery { min-height: 60vh; }
  </style>
</head>
<body>
  <nav>
    <style>
      /* Prevent horizontal cutoff and remove selection/hover effects */
      html, body { margin:0; padding:0; box-sizing:border-box; min-width:0; height:100%; }
      body { min-height:100vh; display:flex; flex-direction:column; }
      *, *:before, *:after { box-sizing:inherit; }
      nav a { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; transition: none; }
      nav a:hover, nav a:active, nav a:focus { background: transparent; outline: none; }

      nav { background:#30513d; display:flex; align-items:center; justify-content:space-between; padding:8px 0; box-sizing:border-box; }
      .nav-left { display:flex; gap:14px; }
      .nav-left a { color:#fff; text-decoration:none; font-weight:600; padding:6px 10px; border-radius:6px; }
      .site-title { color:#fff; font-weight:800; font-size:1.05rem; margin-left:0; }
      /* Make settings visually minimal */
      .gear-box { background:transparent; border:0; padding:0; flex:0 0 32px; display:flex; align-items:center; justify-content:center; }
      .gear-box img { width:22px; height:22px; display:block; filter:invert(1); }
      .settings-dropdown .dropdown-content { background:transparent; box-shadow:none; border:0; padding:0; display:flex; flex-direction:column; gap:6px; }
      /* Disable underline/hover animations on nav links */
      .nav-left a { text-decoration:none !important; transition: none !important; }
      .nav-left a::before, .nav-left a::after { display:none !important; }
      .right-group { display:flex; align-items:center; gap:12px; }
    </style>
    <div class="nav-left">
      <a href="/Home" aria-label="Home">Home</a>
      <a href="/Gallery" aria-label="Gallery">Gallery</a>
      <a href="/TopFlickers" aria-label="Leaderboard">Leaderboard</a>
    </div>
    <div class="right-group">
      <div class="settings-dropdown">
        <div class="gear-box"><img src="/assets/GUI/gear.png" alt="Settings" class="gear-icon" style="filter:invert(1);opacity:0.9;"></div>
        <div class="dropdown-content" style="background:transparent;"></div>
      </div>
      <div class="site-title">RealArtMaine</div>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search videographers, tags, crews, or styles...">
      <select id="sortSelect" aria-label="Sort results" title="Sort results" style="margin-left:10px;padding:8px;border-radius:6px;">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>

    <div class="gallery" id="galleryContainer">
      <!-- Videos inserted by JS -->
    </div>
  </main>

  <script src="/assets/js/maintenance.js"></script>
  <script src="/assets/js/videos.js"></script>
  <script src="/assets/js/background.js"></script>
  <script src="/assets/js/darkmode.js"></script>
</body>
</html>
