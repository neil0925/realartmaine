<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Art Maine | Gallery</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Use single site logo as favicon -->
  <link rel="icon" href="/assets/logo.png" type="image/png">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="/Home" aria-label="Home">
      <img src="/assets/GUI/home.png" alt="Home" class="nav-icon">
    </a>
    <a href="/Gallery" aria-label="Gallery" class="nav-gallery">
      <img src="/assets/GUI/gallery.png" alt="Gallery" class="nav-icon">
    </a>
    <a href="/TopFlickers" aria-label="Top Flickers" class="nav-topflickers">Top Flickers</a>

    <!-- Settings Dropdown -->
    <div class="settings-dropdown">
      <div class="gear-box">
        <img src="/assets/GUI/gear.png" alt="Settings" class="gear-icon">
      </div>
      <div class="dropdown-content">
        <button id="modeToggle">
          <img src="/assets/GUI/DarkMode.png" alt="Mode toggle" id="modeIcon">
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search tags, crews, photographers, or styles...">
      <select id="sortSelect" aria-label="Sort results" title="Sort results" style="margin-left:10px;padding:8px;border-radius:6px;">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>

    <div class="gallery" id="galleryContainer">
      <!-- Images + ads inserted by JS -->
    </div>
  </main>

  <script src="/assets/js/maintenance.js"></script>
  <script src="/assets/js/gallery.js"></script>
  <script src="/assets/js/darkmode.js"></script>
</body>
</html>
