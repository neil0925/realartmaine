<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Art Maine | Gallery</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- AdSense: required snippet inserted into <head> -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6627789827798682"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="/Home">Home</a>
    <a href="/Gallery">Gallery</a>

    <!-- Settings Dropdown -->
    <div class="settings-dropdown">
      <div class="gear-box">
        <img src="../assets/images/gear.png" alt="Settings" class="gear-icon">
      </div>
      <div class="dropdown-content">
        <button id="modeToggle">
          <img src="../assets/images/DarkMode.png" alt="Mode toggle" id="modeIcon">
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search tags, crews, photographers, or styles...">
    </div>

    <div class="gallery" id="galleryContainer">
      <!-- Images + ads inserted by JS -->
    </div>
  </main>

  <script src="../assets/js/gallery.js"></script>
  <script src="../assets/js/darkmode.js"></script>
</body>
</html>
