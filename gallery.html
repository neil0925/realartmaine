<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Art Maine | Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- inline tiny SVG favicon to avoid 404 for /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="home.html">Home</a>
    <a href="gallery.html">Gallery</a>

    <!-- Settings Dropdown -->
    <div class="settings-dropdown">
      <div class="gear-box">
        <img src="images/gear.png" alt="Settings" class="gear-icon">
      </div>
      <div class="dropdown-content">
        <button id="modeToggle">
          <img src="images/DarkMode.png" alt="Mode toggle" id="modeIcon">
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search tags, crews, photographers, or styles...">
    </div>

    <div class="gallery" id="galleryContainer">
      <!-- Images + ads inserted by JS -->
    </div>
  </main>

  <script src="js/gallery.js"></script>
  <script src="js/darkmode.js"></script>
</body>
</html>
